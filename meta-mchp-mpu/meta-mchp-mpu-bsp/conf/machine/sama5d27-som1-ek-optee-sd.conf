#@TYPE: Machine
#@Name: MICROCHIP SAMA5D2-SOM1-EK-OPTEE SD
#@DESCRIPTION: Machine configuration for Microchip SAMA5D2-SOM1 optee sd evaluation kit

require include/sama5d2.inc

MACHINE_FEATURES = "apm alsa ext2 ext3 usbhost usbgadget touchscreen"
KERNEL_DEVICETREE = "microchip/at91-sama5d27_som1_ek.dtb"
DT_MACHINE ?= "sama5d27_som1_ek"

IMAGE_FSTYPES += " tar.gz wic"
WKS_FILE = "sdimage-bootpart.wks"

IMAGE_BOOT_FILES = "BOOT.BIN u-boot.bin uboot.env sama5d27_som1_ek.itb tee.bin"

UBOOT_MACHINE ?= "sama5d27_som1_ek_mmc_optee_defconfig"
UBOOT_ENV_SIZE = "0x1000"

MACHINE_ESSENTIAL_EXTRA_RDEPENDS += " dt-overlay-mchp"

# Add deploy functions to the wic image dependency
do_image_wic[depends] += " u-boot-mchp:do_deploy"
do_image_wic[depends] += " dt-overlay-mchp:do_deploy"

MACHINEOVERRIDES =. "mpuall:sama5d27_som1_ek:"
