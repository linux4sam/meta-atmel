#@TYPE: Machine
#@Name: MICROCHIP SAMA5D3 Xplained SD
#@DESCRIPTION: Machine configuration for Microchip SAMA5D3 xplained sd board

require include/sama5d3.inc

MACHINE_FEATURES += " wifi"
KERNEL_DEVICETREE = "microchip/at91-sama5d3_xplained.dtb"
DT_MACHINE ?= "sama5d3_xplained"

IMAGE_FSTYPES += " tar.gz wic"

WKS_FILE = "sdimage-bootpart.wks"
IMAGE_BOOT_FILES = "BOOT.BIN u-boot.bin uboot.env sama5d3_xplained.itb"

# used by sysvinit_2
SERIAL_CONSOLES ?= "115200;ttyS0 115200;ttyGS0"

UBOOT_MACHINE ?= "sama5d3_xplained_mmc_defconfig"
UBOOT_ENTRYPOINT = "0x20008000"
UBOOT_LOADADDRESS = "0x20008000"
UBOOT_ENV_SIZE = "0x4000"

MACHINE_ESSENTIAL_EXTRA_RDEPENDS += " dt-overlay-mchp"

# Add deploy functions to the wic image dependency
do_image_wic[depends] += " u-boot-mchp:do_deploy"
do_image_wic[depends] += " dt-overlay-mchp:do_deploy"

MACHINEOVERRIDES =. "mpuall:sama5d3_xplained:"
