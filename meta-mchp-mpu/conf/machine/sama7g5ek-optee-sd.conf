#@TYPE: Machine
#@Name: Microchip SAMA7G5-EK OPTEE SD
#@DESCRIPTION: Machine configuration for Microchip SAMA7G5 optee sd evaluation kit

require include/sama7g5.inc

MACHINE_FEATURES = "apm alsa ext2 ext3 usbhost usbgadget"
KERNEL_DEVICETREE = "microchip/at91-sama7g5ek.dtb"
DT_MACHINE ?= "sama7g5ek"

IMAGE_FSTYPES += " tar.gz wic"

WKS_FILE = "sdimage-bootpart.wks"

IMAGE_INSTALL += " optee-os optee-test optee-examples "
IMAGE_BOOT_FILES = "BOOT.BIN u-boot.bin uboot.env sama7g5ek.itb tee.bin"

UBOOT_MACHINE ?= "sama7g5ek_mmc1_optee_defconfig"
UBOOT_ENV_SIZE = "0x4000"

MACHINEOVERRIDES =. "sama7g5ek:"
