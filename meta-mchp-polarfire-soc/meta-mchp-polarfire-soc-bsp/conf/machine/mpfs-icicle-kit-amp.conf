#@TYPE: Machine
#@NAME: mpfs-icicle-kit-amp
#@SOC: Polarfire SoC
#@DESCRIPTION: Machine configuration for the Microchip Polarfire SoC Icicle Kit in AMP mode

require include/mpfs-common.inc

MACHINE_TYPE = "amp"

MACHINE_FEATURES:append = " pci usbgadget usbhost wifi"

RISCV_SBI_FDT ?=  "mpfs-icicle-kit.dtb"
KERNEL_DTC_FLAGS += "-@"
KERNEL_DEVICETREE ?= "microchip/mpfs-icicle-kit.dtb microchip/mpfs-icicle-kit-prod.dtb"
FIT_CONF_PREFIX ?= "conf-microchip,"

UBOOT_MACHINE = "microchip_mpfs_icicle_amp_defconfig"

## Generate a boot.scr file which should be included
##  in the boot partition. It will try to load a kernel image from mmc
UBOOT_ENV = "boot"
UBOOT_ENV_SUFFIX = "scr"
UBOOT_ENV_SIZE = "0x2000"

## Select the YAML file used for building the HSS payload
HSS_PAYLOAD = "amp"

## Set this to "freertos" for a Linux + FreeRTOS demo or "bm" for a Linux + Bare Metal demo
AMP_DEMO = "freertos"
#AMP_DEMO = "bm"

IMAGE_INSTALL:append = " packagegroup-mchp-apps-amp"

IMAGE_BOOT_FILES ?= " \
    fitImage \
    boot.scr \
    uboot.env \
"

WKS_FILE ?= "mpfs-rootfs.wks"

MACHINEOVERRIDES .= ":mpfs:mpfs-icicle-kit-all"
